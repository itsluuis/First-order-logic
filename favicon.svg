<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="popGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1cb0f6" />
      <stop offset="100%" stop-color="#58cc02" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#0e7490" flood-opacity="0.8" />
    </filter>
  </defs>
  <!-- Base 3D de sombra -->
  <rect x="4" y="8" width="56" height="52" rx="16" fill="#0b1728" />
  <rect x="4" y="8" width="56" height="48" rx="16" fill="#0d9488" />
  <!-- Cara frontal 3D -->
  <rect x="4" y="4" width="56" height="48" rx="16" fill="url(#popGrad)" />
  <!-- Brillo superior -->
  <path d="M12 8 Q32 14 52 8" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Símbolos Lógicos ∧∨ -->
  <text x="32" y="32" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">∧∨</text>
</svg>
